detection:
  face:
    detection_interval: 3  
    min_confidence: 0.8
  eye_tracking:
    gaze_threshold: 2          # seconds
    # blink_threshold: 0.3       # EAR threshold for blink detection
    # gaze_sensitivity: 15       # pixels threshold for gaze detection
    consecutive_frames: 2      # frames for gaze change detection
  multi_face:
    alert_threshold: 1     # frames
    # MediaPipe Face Detection parameters
    model_selection: 1                 # 0: short-range (2m), 1: full-range
    min_detection_confidence: 0.5      # raise for fewer false positives, lower for higher recall
    upscale_factor: 1.0                # 1.0 = no upscale; 1.5-2.0 can help tiny faces (slower)
    min_area_px: 600                   # ignore tiny detections under this pixel area
    show_debug_sources: false          # draw per-source boxes (only MediaPipe here)
    show_final_green: true             # draw final green boxes used for counting
  objects:
    # Model and inference settings
    model_path: "/app/models/yolov8l.pt"   # baked into image by Dockerfile
    imgsz: 960                         # input size for YOLO
    base_conf: 0.5                     # base confidence used by YOLO
    iou: 0.6                           # NMS IoU threshold
    augment: true                      # test-time augmentation for better recall

    # Runtime throttling
    detection_interval: 5              # frames between detections
    max_fps: 5                         # max detection calls per second

    # Global fallback confidence if per-class not defined
    min_confidence: 0.65

    # Class configuration (COCO IDS -> label)
    class_map:
      "73": "book"
      "67": "cell phone"
      "62": "tv"
      "65": "remote"
      "63": "laptop"

    # Per-class thresholds (override base_conf/min_confidence)
    class_thresholds:
      "62": 0.85   # tv (strict)
      "63": 0.85   # laptop
      "65": 0.55   # remote
      "67": 0.55   # cell phone
      "73": 0.55   # book

    # Special handling for TVs to reduce false positives
    tv_class_id: 62
    tv_min_area_frac: 0.015            # 1.5% of frame area
    
  audio_monitoring:
    # enabled: true
    # sample_rate: 16000
    # chunk_size: 4096
    whisper_enabled: true  # Enable only when needed
    whisper_model: "medium"
