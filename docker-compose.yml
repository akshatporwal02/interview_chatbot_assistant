version: '3.8'

services:
  interview-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-chatbot-assistant
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      # Add your environment variables here
      - DAILY_API_KEY=${DAILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_RECEIVER=${EMAIL_RECEIVER}
    volumes:
      # Mount results directory to persist data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./recordings:/app/recordings
      # Mount config for easy updates
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["/entrypoint.sh", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits for local testing
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
