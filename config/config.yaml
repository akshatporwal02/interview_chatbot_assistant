
logging:
  log_path: "./session_data/logs"
  alert_cooldown: 10          # seconds

global:
  output_path: "./reports"

                 
reporting:
   image_dir: "./reports/generated/images"  # New subdirectory for images
   output_dir: "./reports/generated"
   # Leave blank to use wkhtmltopdf from PATH (recommended for Docker/Linux). Set an absolute path on Windows if needed.
   wkhtmltopdf_path: ""
   rating_thresholds:
      TOTAL VIOLATIONS:
         critical: 7
         major: 5
         medium: 3
      FACE_DISAPPEARED:
         critical: 7
         major: 5
         medium: 3
      FORBIDDEN_OBJECT:
         critical: 3
         major: 2
         medium: 1
      MULTIPLE_FACES:
         critical: 3
         major: 2
         medium: 1   
      EYE_MOVEMENT:
         critical: 5
         major: 4
         medium: 3



   severity_levels:
      FACE_DISAPPEARED: 2
      EYE_MOVEMENT: 1
      MULTIPLE_FACES: 3
      FORBIDDEN_OBJECT: 4
 
recording:
  poll_total_secs: 180       # total time to wait for cloud recording (seconds)
  poll_interval_secs: 6      # interval between polls (seconds)